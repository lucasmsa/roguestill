name: Roguestill
options:
  bundleIdPrefix: com.lucasmsa
  deploymentTarget:
    macOS: "14.0"
packages:
  RoguestillKit:
    path: .
settings:
  base:
    DEVELOPMENT_TEAM: 6S85XSVS8M
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Roguestill:
    type: application
    platform: macOS
    sources:
      - path: Sources/RoguestillBar
        excludes: ["Resources"]
      - path: Sources/RoguestillBar/Resources
        type: folder
    dependencies:
      - package: RoguestillKit
      - target: RoguestillWidget
    entitlements:
      path: Roguestill.entitlements
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Roguestill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasmsa.roguestill
  RoguestillWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: RoguestillKit
    entitlements:
      path: Widget/RoguestillWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: Roguestill Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasmsa.roguestill.widget
