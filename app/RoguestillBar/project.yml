name: Roguestill
options:
  bundleIdPrefix: com.lucasmsa
  deploymentTarget:
    macOS: "14.0"
packages:
  RoguestillKit:
    path: .
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Roguestill:
    type: application
    platform: macOS
    sources:
      - path: Sources/RoguestillBar
        excludes: ["Resources"]
      - path: Sources/RoguestillBar/Resources
        type: folder
      - path: Assets.xcassets
      - path: ../../target/release/roguestilld
        buildPhase:
          copyFiles:
            destination: executables
            subpath: ""
        attributes: [CodeSignOnCopy]
      - path: LaunchAgents/com.lucasmsa.roguestill.daemon.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    preBuildScripts:
      - name: Build daemon
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../.."
          cargo build --release -p roguestilld
    dependencies:
      - package: RoguestillKit
      - target: RoguestillWidget
    entitlements:
      path: Roguestill.entitlements
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Roguestill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasmsa.roguestill
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RoguestillWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: RoguestillKit
    entitlements:
      path: Widget/RoguestillWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: Roguestill Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasmsa.roguestill.widget
